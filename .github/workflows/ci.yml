name: CORTEX CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  python-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pytest-asyncio pytest-mock respx httpx flake8

      - name: Lint (flake8)
        run: |
          flake8 apps/api/src cortex_upgrade packages \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,.venv

      - name: Validate Engineering Diary Invariants
        run: python scripts/validate_diary.py

      - name: Run Full Test Suite (unit + integration + upgrade)
        run: pytest tests --verbose

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: python-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t cortex .

  typescript-build:
    name: TypeScript SDK & Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Browser SDK
        run: |
          npm ci --workspace=packages/sdk
          npm run build --workspace=packages/sdk

      - name: Install & Build Next.js Dashboard
        run: |
          npm ci --workspace=apps/dashboard
          cd apps/dashboard
          npm run build

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan Python Dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt

      - name: Scan Node.js Dependencies
        run: |
          npm audit --audit-level=high
