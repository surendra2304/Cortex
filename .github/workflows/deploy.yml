name: Cortex Production Image Build & Push

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pytest-asyncio respx httpx pytest-mock

      - name: Validate Diary Constraints
        run: python scripts/validate_diary.py

      - name: Run Pytest Test Suite
        run: pytest -v

  build-and-push:
    name: Build and Push Docker Image to GHCR
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Image Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Cortex Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

  # Deployment to Oracle Cloud Always Free (https://friday-universe.duckdns.org)
  # is handled by the server pulling the latest GHCR image and restarting
  # the container in the friday_mesh Docker network via SSH or Watchtower.
