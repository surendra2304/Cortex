name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/event_schema -e packages/agents -e packages/ai_universe_adapter -e packages/tool_runtime -e packages/integrations -e packages/policy_engine -e packages/workflow_engine -e packages/identity -e packages/analytics -e packages/intelligence -e packages/memory -e apps/api
          pip install pytest pytest-asyncio respx httpx

      - name: Validate Diary Constraints
        run: python scripts/validate_diary.py

      - name: Run Pytest Test Suite
        run: pytest -v

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-api:latest

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:latest

  deploy-staging:
    name: Deploy to Staging & Run Smoke Tests
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Staging Rollout
        run: echo "Deploying images to Staging ECS cluster..."

      - name: Run Staging Smoke Tests
        run: echo "Verifying /v1/health and /health/ready probes on Staging..."

  deploy-production:
    name: Deploy to Production (Rolling Update)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production Rolling Update
        run: echo "Performing zero-downtime rolling update on Production ECS cluster..."
