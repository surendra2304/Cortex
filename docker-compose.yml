version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus_db
      POSTGRES_DSN: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus_db
      REDIS_URL: redis://redis:6379/0
      MOCK_MODE: "true"
      AI_UNIVERSE_BASE_URL: https://api.ai-universe.dev
      JWT_SECRET: super_secret_jwt_signing_key_replace_in_production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-worker
    restart: unless-stopped
    command: ["python", "apps/worker/src/nexus_worker/main.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus_db
      POSTGRES_DSN: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus_db
      REDIS_URL: redis://redis:6379/0
      MOCK_MODE: "true"
      AI_UNIVERSE_BASE_URL: https://api.ai-universe.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: nexus-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_NEXUS_API_URL: http://localhost:8000
      NEXT_PUBLIC_OPERATOR_TOKEN: mock_operator_jwt_token_123
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
