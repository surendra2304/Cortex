version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    # Keep Redis off public interfaces; internal containers use the service name.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cortex-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${CORTEX_DATABASE_URL:?CORTEX_DATABASE_URL must be an Oracle DSN}
      POSTGRES_DSN: ${CORTEX_DATABASE_URL:?CORTEX_DATABASE_URL must be an Oracle DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MOCK_MODE: ${MOCK_MODE:-false}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://inference:8000}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cortex-worker
    restart: unless-stopped
    command: ["python", "-m", "cortex_worker.main"]
    environment:
      DATABASE_URL: ${CORTEX_DATABASE_URL:?CORTEX_DATABASE_URL must be an Oracle DSN}
      POSTGRES_DSN: ${CORTEX_DATABASE_URL:?CORTEX_DATABASE_URL must be an Oracle DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MOCK_MODE: ${MOCK_MODE:-false}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://inference:8000}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: cortex-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CORTEX_API_URL: ${NEXT_PUBLIC_CORTEX_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  redis_data:
    driver: local
