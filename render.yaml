services:
  - type: web
    name: cortex
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/cortex.db
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOW_DEMO_BYPASS
        value: "true"
      - key: CORTEX_URL
        value: https://cortex-qifr.onrender.com
