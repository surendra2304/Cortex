services:
  - type: web
    name: cortex
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: APP_ENV
        value: "production"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./data/cortex.db"
      - key: POSTGRES_DSN
        value: "sqlite+aiosqlite:///./data/cortex.db"
      - key: MOCK_MODE
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: CORTEX_API_KEY
        sync: false
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        sync: false
      - key: INFERENCE_URL
        value: "https://inference-r1sn.onrender.com"
      - key: INFERENCE_API_KEY
        sync: false
      - key: STRATEX_URL
        value: "https://stratex-8wj1.onrender.com"
      - key: STRATEX_API_KEY
        sync: false
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: MEMORA_API_KEY
        sync: false
      - key: INTELX_URL
        value: "https://intelx-mygl.onrender.com"
      - key: INTELX_API_KEY
        sync: false
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        sync: false
      - key: FORGE_URL
        value: "https://forge-e9kl.onrender.com"
      - key: FORGE_API_KEY
        sync: false
      - key: SENTINEL_URL
        value: "https://sentinel-a861.onrender.com"
      - key: SENTINEL_API_KEY
        sync: false
