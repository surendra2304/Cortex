[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-monorepo"
version = "2.0.0"
description = "CORTEX Autonomous Operations Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "sendgrid>=6.11.0",
    "twilio>=9.0.0",
    "hubspot-api-client>=12.0.0",
    "stripe>=7.0.0",
    "python-jose[cryptography]>=3.3.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/core/src/cortex_core",
    "packages/event_schema/src/cortex_event_schema",
    "packages/agents/src/cortex_agents",
    "packages/ai_universe_adapter/src/cortex_ai_universe_adapter",
    "packages/tool_runtime/src/cortex_tool_runtime",
    "packages/integrations/src/cortex_integrations",
    "packages/policy_engine/src/cortex_policy_engine",
    "packages/workflow_engine/src/cortex_workflow_engine",
    "packages/identity/src/cortex_identity",
    "packages/analytics/src/cortex_analytics",
    "packages/intelligence/src/cortex_intelligence",
    "packages/memory/src/cortex_memory",
    "apps/api/src/cortex_api",
    "cortex_upgrade"
]
